<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Acidio notes~</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- Optional handwriting font for more realism -->
  <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="yellowpad-container">
    <div class="yellowpad-line"><h1>Notes</h1></div>
    <div class="yellowpad-line"><a href="acid-base-equilibria.html"><h2>Acid-Base Equilibria</h2></a></div>
    <div class="yellowpad-line"><a href="hypothetical-solutions.html"><h2>Hypothetical Solutions</h2></a></div>
  </div>

  <script>
    // Fade-in effect when lines are scrolled into view
    const lines = document.querySelectorAll('.yellowpad-line');
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target); // Only animate once
        }
      });
    }, { threshold: 0.2 });

    lines.forEach(line => observer.observe(line));
  </script>
</body>
</html>
